`<div class=rw style="margin:12px 0">${['Livraison','Retrait'].map(m=>`<button class="ch ${C.mode==m?'on':''}" data-a=mode data-k="${m}">${m}</button>`).join('')}</div>

cat(){return '<button class=b data-a=cadd>+ Ajouter une catégorie</button>'+S.cats.map((c,i)=>`<div class=rt><input style="width:58px" data-i=ce data-k="${i}:e" value="${e(c.e)}"><input data-i=ce data-k="${i}:n" value="${e(c.n)}"><label class=ck style="white-space:nowrap"><input type=checkbox data-c=ch data-k="${i}" ${c.h?'checked':''}> Accueil</label><button class="b b2 bs" data-a=cmv data-k="${i}:-1">▲</button><button class="b b2 bs" data-a=cmv data-k="${i}:1">▼</button><button class="b b2 bs" data-a=cdel data-k="${i}">✕</button></div>`).join('')},
look(){const s=S.shop;return `<div id=pv>${hero()}</div><label>Nom de la boutique<input data-i=sh data-k=name value="${e(s.name)}"></label><label>Texte d’accueil<textarea rows=2 data-i=sh data-k=tag>${e(s.tag)}</textarea></label><label>Texte du bouton<input data-i=sh data-k=btn value="${e(s.btn)}"></label><label>Infos livraison et retrait<input data-i=sh data-k=info value="${e(s.info)}"></label>
<div class=rt style="border:0"><label style="flex:1">Couleur principale<input type=color data-i=sh data-k=c1 value="${s.c1}"></label><label style="flex:1">Couleur d’accent<input type=color data-i=sh data-k=c2 value="${s.c2}"></label></div>
<label>Logo<input type=file accept="image/*" data-c=img data-k=logo></label><label>Bannière d’accueil<input type=file accept="image/*" data-c=img data-k=banner></label>
<div class=rt style="border:0"><button class="b b2 bs" data-a=imgx data-k=logo>Retirer le logo</button><button class="b b2 bs" data-a=imgx data-k=banner>Retirer la bannière</button></div><label>Code d’accès administrateur<input data-i=sh data-k=pin value="${e(s.pin)}"></label><p class=mu>Les changements s’appliquent aussitôt à la boutique.</p>`},
dlv(){const s=S.shop;return `<label>Commande minimum en livraison (€)<input type=number min=0 data-i=sh data-k=min value="${s.min}"></label><h3>Rayon et frais de livraison</h3><p class=mu>Chaque tranche donne une distance maximale et ses frais. La dernière tranche fixe le rayon de livraison.</p>
${s.tiers.map((t,i)=>`<div class=rt><label style="flex:1">Jusqu’à (km)<input type=number step=.5 min=0 data-i=tr data-k="${i}:km" value="${t.km}"></label><label style="flex:1">Frais (€)<input type=number step=.1 min=0 data-i=tr data-k="${i}:fee" value="${t.fee}"></label><button class="b b2 bs" data-a=tdel data-k="${i}">✕</button></div>`).join('')}
<button class="b b2 bs" data-a=tadd>+ Ajouter une tranche</button><h3>Horaires d’ouverture</h3>${DAYS.map((d,i)=>`<div class=rt><span style="width:84px">${d}</span><input data-i=hr data-k="${i}" value="${e(s.hrs[i])}" placeholder="11:00-23:00 ou Fermé"></div>`).join('')}
<div class=rt style="border:0"><span style="flex:1">Commandes : <b>${s.open?'ouvertes':'fermées'}</b></span><button class=b data-a=tog>${s.open?'Fermer temporairement':'Rouvrir les commandes'}</button></div>`},
pro(){return '<button class=b data-a=pradd>+ Ajouter une promotion</button>'+S.promos.map((p,i)=>`<div class=cd><label>Titre affiché<input data-i=po data-k="${i}:t" value="${e(p.t)}"></label><div class=rt style="border:0;padding:0"><label style="flex:1">Remise (%)<input type=number min=0 max=100 data-i=po data-k="${i}:pct" value="${p.pct}"></label><label style="flex:1">Dès (€)<input type=number min=0 data-i=po data-k="${i}:min" value="${p.min}"></label></div><div class=rt style="border:0;padding:0"><label class=ck style="flex:1"><input type=checkbox data-c=pon data-k="${i}" ${p.on?'checked':''}> Active</label><button class="b b2 bs" data-a=prdel data-k="${i}">Supprimer</button></div></div>`).join('')}};
const login=()=>`<div class=w><h2>Administration</h2><p class=mu>Espace réservé au gérant.</p><input type=password id=pin placeholder="Code d’accès" autocomplete=off><p><button class=b style="width:100%" data-a=login>Entrer</button></p><p class=mu>Code de démonstration : 1234. Vous pourrez le changer dans l’onglet Boutique.</p><button class="b b2" data-a=shop>Retour à la boutique</button></div>`;
const adm=()=>{const nn=S.orders.filter(x=>x.st=='Nouvelle').length;return `<div class="w aw"><div class=bar><b>${e(S.shop.name)} · Administration</b><span><button class="b b2 bs" data-a=shop>Voir la boutique</button> <button class="b b2 bs" data-a=out>Quitter</button></span></div><div class=rw>${TABS.map(([k,l])=>`<button class="ch ${TAB==k?'on':''}" data-a=tab data-k="${k}">${l}${k=='ord'&&nn?' ('+nn+')':''}</button>`).join('')}</div><div style="margin-top:10px">${TV[TAB]()}</div></div>`};
const render=()=>{ap();$('#app').innerHTML=V=='adm'?(AD?adm():login()):shop()};

const A={go:()=>{const m=$('#menu');if(m)m.scrollIntoView({behavior:'smooth'})},cat:el=>{F=el.dataset.k;render()},x:()=>modal(),ovl:(el,ev)=>{if(ev.target==el)modal()},
prod:el=>{const p=S.prods.find(x=>x.id==el.dataset.k);if(!p)return;Q={p,q:1,x:[],u:p.p};modal(`<div class=sl style="margin-top:14px">${p.v?`<video src="${p.v}" controls playsinline></video>`:''}${p.im.map(s=>`<img src="${s}" alt="">`).join('')||`<div class=ph>${emo(p.c)}</div>`}</div><h2 style="margin-top:14px">${e(p.n)}</h2><p class=mu>${e(p.d)}</p><b class=pp>${eur(p.p)}</b>${p.x.length?'<h3>Suppléments</h3>'+p.x.map((x,i)=>`<label class=ck><input type=checkbox data-c=px data-k="${i}"> ${e(x.n)} <span>+${eur(x.p)}</span></label>`).join(''):''}
<div class=rt style="border:0"><div class=qt><button class="b b2 bs" data-a=q data-k=-1>−</button><b id=qn>1</b><button class="b b2 bs" data-a=q data-k=1>+</button></div><button class=b style="flex:1" data-a=add>Ajouter · <span id=pt></span></button></div>`);calc()},
q:el=>{Q.q=Math.max(1,Q.q+ +el.dataset.k);calc()},
add:()=>{calc();const key=Q.p.id+'|'+Q.x.map(z=>z.n).join(','),l=cart.find(z=>z.key==key);l?l.q+=Q.q:cart.push({key,n:Q.p.n,p:Q.u,x:Q.x.map(z=>z.n),q:Q.q});modal();render();toast('Ajouté au panier')},
cart:()=>modal(cartH()),cq:el=>{const[i,d]=el.dataset.k.split(':');cart[i].q+=+d;if(cart[i].q<1)cart.splice(i,1);render();modal(cartH())},mode:el=>{C.mode=el.dataset.k;modal(cartH())},
ok:()=>{const t=T(),s=S.shop,L=C.mode=='Livraison';if(!s.open||(L&&t.sub<s.min))return;if(!C.name.trim()||!C.tel.trim()||(L&&!C.addr.trim()))return toast('Renseignez votre nom, votre téléphone'+(L?' et votre adresse.':'.'));
const o={id:uid(),num:'OH-'+(++S.seq),t:Date.now(),name:C.name,tel:C.tel,mode:C.mode,addr:L?C.addr:'',when:C.when,fee:t.fee,disc:t.disc,total:+t.tot.toFixed(2),st:'Nouvelle',items:cart.map(l=>({n:l.n,q:l.q,p:l.p,x:l.x}))};S.orders.push(o);save();cart=[];
modal(`<h2>Commande envoyée ✓</h2><p>Votre numéro de commande :</p><p class=num>${o.num}</p><p class=mu>${C.mode} ${C.when?'à '+e(C.when):'dès que possible'}. Paiement sur place.</p>`);C.when='';render()},
adm:()=>{V='adm';render()},shop:()=>{V='shop';render()},out:()=>{AD=0;V='shop';render()},login:()=>{if($('#pin').value==S.shop.pin){AD=1;render()}else toast('Code incorrect.')},tab:el=>{TAB=el.dataset.k;render()},
tog:()=>{S.shop.open=!S.shop.open;save();render()},reset:el=>cf(el,()=>{S=DEF();save();render();toast('Démo réinitialisée')}),
acc:el=>{S.orders.find(o=>o.id==el.dataset.k).st='Acceptée';save();render()},ref:el=>{S.orders.find(o=>o.id==el.dataset.k).st='Refusée';save();render()},
padd:()=>{Pf={id:'',n:'',d:'',p:'',c:(S.cats[0]||{}).id||'',im:[],v:'',x:[]};modal(pf())},pedit:el=>{Pf=JSON.parse(JSON.stringify(S.prods.find(p=>p.id==el.dataset.k)));modal(pf())},
pdel:el=>cf(el,()=>{S.prods=S.prods.filter(p=>p.id!=el.dataset.k);save();render()}),idel:el=>{Pf.im.splice(+el.dataset.k,1);$('#fim').innerHTML=pim()},xadd:()=>$('#fx').insertAdjacentHTML('beforeend',xr()),xdel:el=>el.closest('.xr').remove(),
psave:()=>{const n=$('#fn').value.trim(),pr=parseFloat($('#fp').value);if(!n||isNaN(pr))return toast('Indiquez au moins un nom et un prix.');
const x=[...document.querySelectorAll('#fx .xr')].map(r=>{const i=r.querySelectorAll('input');return{n:i[0].value.trim(),p:parseFloat(i[1].value)||0}}).filter(z=>z.n);Object.assign(Pf,{n,d:$('#fd').value.trim(),p:pr,c:$('#fc').value,x});
if(Pf.id)S.prods=S.prods.map(p=>p.id==Pf.id?Pf:p);else{Pf.id=uid();S.prods.push(Pf)}save();modal();render();toast('Produit enregistré')},
cadd:()=>{S.cats.push({id:uid(),n:'Nouvelle catégorie',e:'🍽️',h:1});save();render()},cdel:el=>cf(el,()=>{const i=+el.dataset.k;if(S.prods.some(p=>p.c==S.cats[i].id))return toast('Déplacez d’abord les produits de cette catégorie.');S.cats.splice(i,1);save();render()}),
cmv:el=>{const[i,d]=el.dataset.k.split(':').map(Number),j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();render()},
imgx:el=>{S.shop[el.dataset.k]='';save();render()},tadd:()=>{const l=S.shop.tiers[S.shop.tiers.length-1]||{km:0,fee:0};S.shop.tiers.push({km:l.km+2,fee:l.fee+1.5});save();render()},tdel:el=>{S.shop.tiers.splice(+el.dataset.k,1);save();render()},
pradd:()=>{S.promos.push({id:uid(),t:'Nouvelle offre',pct:10,min:0,on:1});save();render()},prdel:el=>cf(el,()=>{S.promos.splice(+el.dataset.k,1);save();render()})};
const I={cf:el=>{C[el.dataset.k]=el.value},ce:el=>{const[i,f]=el.dataset.k.split(':');S.cats[i][f]=el.value;save()},
sh:el=>{const k=el.dataset.k;S.shop[k]=k=='min'?+el.value||0:el.value;ap();const p=$('#pv');if(p)p.innerHTML=hero();save()},
tr:el=>{const[i,f]=el.dataset.k.split(':');S.shop.tiers[i][f]=parseFloat(el.value)||0;save()},hr:el=>{S.shop.hrs[el.dataset.k]=el.value;save()},
po:el=>{const[i,f]=el.dataset.k.split(':');S.promos[i][f]=f=='t'?el.value:+el.value||0;save()}};
const Ch={km:el=>{C.km=+el.value;modal(cartH())},when:el=>{C.when=el.value},px:calc,st:el=>{S.orders.find(o=>o.id==el.dataset.k).st=el.value;save();render()},ch:el=>{S.cats[el.dataset.k].h=el.checked?1:0;save()},pon:el=>{S.promos[el.dataset.k].on=el.checked?1:0;save()},
img:async el=>{const f=el.files[0];if(!f)return;const k=el.dataset.k;toast('Photo en cours…');const d=await rimg(f,k=='logo'?256:1000,k=='logo'?'image/png':'image/jpeg');el.value='';if(!d)return toast('Photo illisible. Essayez avec une photo JPEG.');S.shop[k]=d;save();render();toast('Image enregistrée')},
fph:async el=>{const fl=[...el.files],up=()=>{const q=$('#fim');if(q)q.innerHTML=pim()},bt=(t,d)=>{const b=$('[data-a=psave]');if(b){b.textContent=t;b.disabled=d}};el.value='';let bad=0;for(let i=0;i<fl.length;i++){bt('Photo '+(i+1)+'/'+fl.length+' en cours…',true);let d='';try{d=await rimg(fl[i],800)}catch(x){}d?Pf.im.push(d):bad++;up()}bt('Enregistrer le produit',false);if(bad)toast(bad+' photo(s) illisible(s). Essayez avec une photo JPEG.')},
fvd:el=>{const f=el.files[0];if(!f)return;if(f.size>2.5e6)return toast('Vidéo trop lourde pour l’enregistrement sur cet appareil (max 2,5 Mo).');const fr=new FileReader();fr.onload=()=>{Pf.v=fr.result;$('#fvv').innerHTML=`<video src="${Pf.v}" controls playsinline></video>`};fr.readAsDataURL(f)}};
